# Install and test
name: Python package
on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version:
          - "3.10"
          - "3.11"
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # pin@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # pin@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install .[dev]
      - name: Check docstrings
        run: python -m pydocstyle edgetest_hub --convention=numpy
      - name: Check static typing
        run: python -m mypy edgetest_hub
      - name: Run flake8
        run: python -m flake8 edgetest_hub
      - name: Run unit testing
        run: python -m pytest tests --cov=edgetest_hub --cov-fail-under=90
